[project]
name = "msi-fusion"
version = "0.1.0"
description = "Early vs late fusion of MRI sequences for brain tumour segmentation (BraTS)"
requires-python = ">=3.10"
# Dependencies are added once the framework is chosen (see docs/decisions.md).
